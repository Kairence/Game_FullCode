# Script compiler source root ordering mode.
# Options: LegacyOnly, LegacyFirst, NewFirst, NewOnly
SourceRootMode=LegacyFirst

# Legacy scripts source root (relative to base directory if not absolute).
LegacySourceRoot=Scripts

# Optional new scripts source root (blank disables).
NewSourceRoot=

# Script compiler output root for generated assemblies.
OutputRoot=Scripts/Output

# Assemblies configuration file path for script references.
AssembliesConfigPath=Data/Assemblies.cfg

# Optional excluded script directory names (comma or semicolon separated).
ExcludedDirectoryNames=
